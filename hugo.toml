baseURL = 'https://vccglobal.github.io/'
theme = 'PaperMod'

# ── 多语言 ────────────────────────────────────
# 本文件的语言块由 /tmp/gen_config.py 按统一模板生成，改动请保持格式一致。
# defaultContentLanguageInSubdir = false ⇒ 中文在站点根目录（/posts/...），
# 其余语言各自在 /<语言代码>/ 下。原有中文链接保持不变，不会 404。
#
# 全部 16 种语言均已开放索引。若某语言需要暂时撤出搜索，在它的 params 下
# 加一行 noindex = true 即可：该语言会退出 sitemap，页面改带
# <meta name="robots" content="noindex,follow">。
# params.langGroup：切换器下拉面板的分组（ea 东亚 / sa 南亚 / sea 东南亚 /
# me 中东 / eu 欧洲与美洲）。
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON 供站内搜索使用（每种语言各生成一份）

# 分类/标签的「词条」来自每篇文章的 front matter，因此各语言的分类天然独立。
[taxonomies]
  category = 'categories'
  tag = 'tags'

# ── 全站通用参数（会被各语言的 params 覆盖/补充）──
[params]
  env = 'production'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'      # auto / light / dark
  disableThemeToggle = false

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false
  hideSummary = false
  comments = false

  [[params.socialIcons]]
    name = 'telegram'
    url = 'https://t.me/coinepay_jas'

  [[params.socialIcons]]
    name = 'whatsapp'
    url = 'https://wa.me/message/2I3GXEELDVMHP1'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/vccglobal'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

