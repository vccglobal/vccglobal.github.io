  [[languages.en.menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[languages.en.menu.main]]
    identifier = 'archives'
    name = 'Archives'
    url = '/archives/'
    weight = 20
  [[languages.en.menu.main]]
    identifier = 'categories'
    name = 'Categories'
    url = '/categories/'
    weight = 30
  [[languages.en.menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 40
  [[languages.en.menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 50

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = 'monokai'
