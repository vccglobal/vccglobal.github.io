# Pages CMS 配置 —— https://pagescms.org/docs/configuration/
# 后台地址：https://app.pagescms.org
#
# 站点共 16 种语言（Hugo multilingual），每种语言一个栏目，内容互相独立，
# 分类各写各的，不需要一一对应：
#   简体中文 content/zh/posts → https://vccglobal.github.io/posts/...
#   其余语言 content/<代码>/posts → https://vccglobal.github.io/<代码>/posts/...
#
# 字段标签统一用中文（方便运营），栏目名里标注了目标语言。
# 本文件由脚本按统一模板生成，增改语言时请保持格式一致。

media:
  input: static/images    # 图片实际存放位置（仓库内）
  output: /images         # 写进文章里的图片 URL 前缀

content:

  # ── 简体中文（zh）──────────────────────────
  - name: posts_zh
    label: 中文文章
    type: collection
    path: content/zh/posts
    format: yaml-frontmatter    # 对应 Hugo 的 --- YAML front matter
    filename: "{fields.slug}.md"
    exclude:
      - _index.md
    view:
      fields: [title, date, draft, categories]
      primary: title
      sort: [date, title]
      search: [title, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 英文别名（决定网址，必填，只用小写字母和连字符）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "只能用小写字母、数字和连字符，例如 overseas-education-payment"
      - name: date
        label: 发布时间
        type: date
        required: true
      - name: draft
        label: 存为草稿（勾选后不会发布到线上）
        type: boolean
        default: false
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown

