  title: "Phí chuyển TRC20 quá cao? Hãy thuê năng lượng"
  points:
    - "Mỗi giao dịch USDT-TRC20 sẽ đốt <b>13–27 TRX</b> nếu bạn không đủ năng lượng; chi phí phụ thuộc vào số lần chuyển chứ không phải số tiền chuyển."
