    - "নিবন্ধন ছাড়াই অর্ডার: প্ল্যাটফর্মের ঠিকানায় TRX পাঠান, এনার্জি স্বয়ংক্রিয়ভাবে আপনার পাঠানোর ঠিকানায় অর্পিত হবে।"
    - "ব্যাচ ট্রান্সফার, এক্সচেঞ্জ ও ব্যবসায়ীরা API দিয়ে ভাড়া স্বয়ংক্রিয় করতে পারেন।"
